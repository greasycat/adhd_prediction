name: adhd-prediction
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python>=3.12
  
  # Core dependencies from pyproject.toml
  - boto3>=1.40.73
  - jupyter>=1.1.1
  - nilearn>=0.12.1
  - pandas>=2.3.3
  - seaborn>=0.13.2
  - tqdm>=4.67.1
  
  # Scientific computing stack
  - numpy>=1.24
  - scipy>=1.11
  - scikit-learn>=1.3
  
  # Visualization
  - matplotlib>=3.7
  
  # Neuroimaging
  - nibabel>=5.0
  
  # Jupyter
  - ipykernel
  - ipython
  - notebook
  
  
  # Pip dependencies
  - pip:
    - nilearn>=0.12.1
    - torch>=2.9.1
    - torchvision>=0.24.1

